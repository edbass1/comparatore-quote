name: Aggiorna quote

on:
  schedule:
    # Ogni 30 minuti; la fascia viene filtrata usando l'ora italiana (Europe/Rome)
    - cron: "0,30 * * * *"
  workflow_dispatch:          # avvio manuale: Actions > Aggiorna quote > Run workflow
  push:
    branches: [main]
    paths-ignore:
      - "stato/**"
      - "README.md"

permissions:
  contents: write             # per il commit di stato/ultimo-aggiornamento.json (mantiene attivo il cron)
  pages: write
  id-token: write

concurrency:
  group: aggiorna-quote
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Verifica fascia oraria italiana
        id: orario
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            echo "attivo=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ora=$(TZ=Europe/Rome date +%H)
          if [ "$ora" -ge 8 ]; then
            echo "attivo=true" >> "$GITHUB_OUTPUT"
            echo "Aggiornamento consentito: sono le $(TZ=Europe/Rome date +'%H:%M') in Italia."
          else
            echo "attivo=false" >> "$GITHUB_OUTPUT"
            echo "Fascia di pausa: sono le $(TZ=Europe/Rome date +'%H:%M') in Italia. Nessun aggiornamento."
          fi
      - uses: actions/setup-python@v6
        if: steps.orario.outputs.attivo == 'true'
        with:
          python-version: "3.12"
      - name: Installa dipendenze
        if: steps.orario.outputs.attivo == 'true'
        run: pip install -r requirements.txt
      - name: Scarica quote (Oddschecker Italia + Oddspedia Italia)
        if: steps.orario.outputs.attivo == 'true'
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p site_out
          cp -r site/. site_out/
          python scraper/fetch.py --out site_out
          cp site_out/data/stato.json stato/ultimo-aggiornamento.json
      - uses: actions/configure-pages@v6
        if: steps.orario.outputs.attivo == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.orario.outputs.attivo == 'true'
        with:
          path: site_out
      - id: deployment
        uses: actions/deploy-pages@v5
        if: steps.orario.outputs.attivo == 'true'
      - name: Commit stato (mantiene attiva la pianificazione)
        if: steps.orario.outputs.attivo == 'true'
        run: |
          cp stato/ultimo-aggiornamento.json /tmp/stato.json
          git config user.name "github-actions[bot]"
          git config user.email "41898237+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/stato.json stato/ultimo-aggiornamento.json
            git add stato/ultimo-aggiornamento.json
            git commit -qm "Quote aggiornate $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "Commit dello stato non riuscito" && exit 1
