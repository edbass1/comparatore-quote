name: Diagnosi Oddschecker
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install curl_cffi playwright && sudo apt-get install -y xvfb >/dev/null
      - run: xvfb-run -a python diag/oc_diag.py
